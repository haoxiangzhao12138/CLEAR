# sweep_config.yaml — Hyperparameter search space reference
#
# This file is no longer used directly by wandb sweep.
# Instead, Optuna handles Bayesian optimization locally (see sweep_agent.py).
# This file is kept as a human-readable reference of the search space.
#
# After evaluation, use `wandb sync` to upload offline runs.

# Search space definition (consumed by sweep_agent.py)
parameters:
  text_temperature:
    type: float
    low: 0.1
    high: 1.0

  do_sample:
    type: categorical
    choices: [true, false]

  repetition_penalty:
    type: float
    low: 1.0
    high: 1.5

  max_think_token_n:
    type: int
    low: 2048
    high: 8192

  max_new_tokns:
    type: int
    low: 512
    high: 2048

  is_thinking:
    type: categorical
    choices: [true, false]

  cfg_text_scale:
    type: float
    low: 1.0
    high: 7.0

  cfg_img_scale:
    type: float
    low: 1.0
    high: 3.0

  cfg_interval_low:
    type: float
    low: 0.0
    high: 0.6

  cfg_interval_high:
    type: float
    low: 0.6
    high: 1.0

  timestep_shift:
    type: float
    low: 1.0
    high: 6.0

  num_timesteps:
    type: int
    low: 20
    high: 100

  cfg_renorm_min:
    type: float
    low: 0.0
    high: 1.0

  consider_think:
    type: categorical
    choices: [true, false]

  output_need_vae:
    type: categorical
    choices: [true, false]

  output_need_vit:
    type: categorical
    choices: [true, false]

  max_inter_num:
    type: int
    low: 1
    high: 5

optimization:
  direction: maximize
  metric: avg_score
  sampler: TPE  # Tree-structured Parzen Estimator (Bayesian)
  n_trials: 50  # total number of trials
