# sweep_config.yaml — Wandb online sweep configuration
#
# This file is used by wandb.sweep() to create an online sweep.
# The sweep dashboard will be available at wandb.ai.

program: sweep_agent.py
method: bayes
metric:
  name: avg_score
  goal: maximize

parameters:
  repetition_penalty:
    distribution: uniform
    min: 1.0
    max: 1.5

  cfg_text_scale:
    distribution: uniform
    min: 1.0
    max: 7.0

  cfg_img_scale:
    distribution: uniform
    min: 1.0
    max: 5.0

  cfg_interval_low:
    distribution: uniform
    min: 0.0
    max: 0.6

  cfg_interval_high:
    distribution: uniform
    min: 0.6
    max: 1.0

  timestep_shift:
    distribution: uniform
    min: 1.0
    max: 6.0

  num_timesteps:
    distribution: int_uniform
    min: 20
    max: 100

  cfg_renorm_min:
    distribution: uniform
    min: 0.0
    max: 1.0

  consider_think:
    values: [true, false]

