program: sweep_agent.py
method: bayes
metric:
  name: avg_score
  goal: maximize

parameters:
  text_temperature:
    distribution: uniform
    min: 0.1
    max: 1.0

  do_sample:
    values: [true, false]

  repetition_penalty:
    distribution: uniform
    min: 1.0
    max: 1.5

  max_think_token_n:
    distribution: int_uniform
    min: 2048
    max: 8192

  max_new_tokns:
    distribution: int_uniform
    min: 512
    max: 2048

  is_thinking:
    values: [true, false]

  cfg_text_scale:
    distribution: uniform
    min: 1.0
    max: 7.0

  cfg_img_scale:
    distribution: uniform
    min: 1.0
    max: 3.0

  cfg_interval_low:
    distribution: uniform
    min: 0.0
    max: 0.6

  cfg_interval_high:
    distribution: uniform
    min: 0.6
    max: 1.0

  timestep_shift:
    distribution: uniform
    min: 1.0
    max: 6.0

  num_timesteps:
    distribution: int_uniform
    min: 20
    max: 100

  cfg_renorm_min:
    distribution: uniform
    min: 0.0
    max: 1.0

  consider_think:
    values: [true, false]

  output_need_vae:
    values: [true, false]

  output_need_vit:
    values: [true, false]

  max_inter_num:
    distribution: int_uniform
    min: 1
    max: 5
